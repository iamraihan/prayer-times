# Quick sanity gate for every push / PR: the frontend builds and the Rust
# backend type-checks and passes its unit tests on all three platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libgtk-3-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - name: Build frontend (tsc + vite)
        run: pnpm build

      - name: Type-check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `cargo test` regenerates src/lib/bindings from the Rust DTOs (ts-rs).
      # Any diff means someone changed a Rust type without committing the
      # regenerated TypeScript.
      - name: TypeScript bindings are up to date
        if: runner.os == 'Linux'
        run: |
          git add -N src/lib/bindings
          git diff --exit-code -- src/lib/bindings

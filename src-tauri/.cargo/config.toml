# ts-rs writes the TypeScript bindings for IPC types here when `cargo test`
# runs. Cargo finds this file by walking up from the *current directory*, so
# run `cargo test` from inside src-tauri/ (CI does). From the repo root with
# --manifest-path the bindings would land in src-tauri/bindings/ instead.
[env]
TS_RS_EXPORT_DIR = { value = "../src/lib/bindings", relative = true }
